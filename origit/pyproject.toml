[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origit"
version = "0.1.0"
description = "Origit — agent provenance layer for git. Versioning for agents."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
origit = "origit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["origit*"]

[tool.setuptools.package-data]
origit = ["templates/**/*", "templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
